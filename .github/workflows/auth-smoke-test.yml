name: Auth smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: snowflake-tst
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install snowflake-connector-python

      - name: Federated login to Entra
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get token and print claims
        id: token
        run: |
          TOKEN=$(az account get-access-token \
            --resource "${{ vars.SNOWFLAKE_SCOPE }}" \
            --query accessToken -o tsv)

          echo "=== token claims ==="
          python3 - "$TOKEN" <<'PY'
          import sys, base64, json
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("iss", "aud", "sub", "appid", "oid", "azp", "tid"):
              if k in claims:
                  print(f"  {k} = {claims[k]}")
          PY
          echo "===================="

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Connect to Snowflake
        env:
          SNOWFLAKE_OAUTH_TOKEN: ${{ steps.token.outputs.token }}
          SF_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
        run: |
          python - <<'PY'
          import os, snowflake.connector
          conn = snowflake.connector.connect(
              account=os.environ["SF_ACCOUNT"],
              authenticator="oauth",
              token=os.environ["SNOWFLAKE_OAUTH_TOKEN"],
              warehouse="COMPUTE_WH",
              role="CICD_ROLE",
          )
          cur = conn.cursor()
          cur.execute("SELECT CURRENT_USER(), CURRENT_ROLE()")
          print("Connected as:", cur.fetchone())
          cur.close(); conn.close()
          print("AUTH SMOKE TEST PASSED")
          PY
