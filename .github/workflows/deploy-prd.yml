name: Deploy PRD

on:
  push:
    branches: [release/**]
  workflow_dispatch:

concurrency:
  group: deploy-prd
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: snowflake-prd # approval gate AND OIDC subject
    permissions:
      id-token: write # OIDC -> Entra
      contents: write # ONLY to push the release tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install snowflake-connector-python pyyaml

      # Rebuild the chain fresh from DEV in the runner. Nothing committed.
      - name: Generate PRD folders via chain
        run: |
          python deploy/convert_env.py --from dev --to tst
          python deploy/convert_env.py --from tst --to prd

      - name: Federated login to Entra
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Entra OAuth token for Snowflake
        id: token
        run: |
          TOKEN=$(az account get-access-token \
            --resource "${{ vars.SNOWFLAKE_SCOPE }}" \
            --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to PRD
        env:
          SNOWFLAKE_OAUTH_TOKEN: ${{ steps.token.outputs.token }}
        run: python deploy/deploy.py --env prd

      - name: Tag the release
        run: |
          TAG="v${GITHUB_REF_NAME#release/}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists"
          else
            git tag -a "$TAG" -m "Deployed to PRD from ${GITHUB_REF_NAME}"
            git push origin "$TAG"
          fi
