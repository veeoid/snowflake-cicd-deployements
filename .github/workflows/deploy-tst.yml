name: Deploy TST

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-tst
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: snowflake-tst
    if: ${{ !contains(github.event.head_commit.message, '[skip-convert]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install snowflake-connector-python pyyaml

      - name: Generate TST folders from DEV
        run: python deploy/convert_env.py --from dev --to tst

      - name: Commit generated TST folders
        run: |
          git config user.name  "convert-bot"
          git config user.email "convert-bot@users.noreply.github.com"
          for d in MY_PROJECT_TST_PREP_DB MY_PROJECT_TST_ANALYTICS_DB MY_PROJECT_TST_MD_DB; do
            [ -d "$d" ] && git add "$d"
          done
          if git diff --staged --quiet; then
            echo "No TST changes to commit"
            exit 0
          fi
          git commit -m "Generate TST folders from DEV [skip-convert]"
          # main may have advanced while this job ran. Rebase onto the latest
          # remote main and retry the push a few times before giving up.
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed"; exit 0
            fi
            echo "push $i rejected, syncing with remote main and retrying..."
            git pull --rebase origin main || exit 1
          done
          echo "could not push generated folders after retries"; exit 1

      - name: Deploy to TST
        env:
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: python deploy/deploy.py --env tst
